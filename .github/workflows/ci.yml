name: Boreal checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: python scripts/check_public_safe.py
  postgres-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/setup_env.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/http_smoke.py --url http://127.0.0.1:8080
      - run: docker compose --profile verify run --rm verify
      - run: docker compose run --rm ingest
      - run: python scripts/http_smoke.py --url http://127.0.0.1:8080
      - name: Install browser QA tools
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction smoke
        run: python scripts/browser_smoke.py --url http://127.0.0.1:8080
      - name: Save synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boreal-browser-screenshots
          path: test-results/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable CI data
        if: always()
        run: docker compose down -v
